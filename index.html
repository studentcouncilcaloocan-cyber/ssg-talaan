<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>SSG TALAAN</title>

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family:
    Inter,
    Arial,
    sans-serif;
  background:
    #eef3f9;
  color:
    #172b4d;
}

.hidden {
  display: none !important;
}


/* =====================================================
   WELCOME
===================================================== */

.screen {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;
}

.card {
  width: 100%;
  max-width: 700px;
  background: white;
  border-radius: 24px;
  padding: 32px;
  box-shadow:
    0 15px 45px rgba(19,45,85,.12);
}

.welcome-card {
  max-width: 680px;
}

.welcome-title {
  font-size: 38px;
  font-weight: 900;
  text-align: center;
  color: #17266b;
}

.welcome-subtitle {
  text-align: center;
  color: #718096;
  margin: 8px 0 30px;
}

.role-grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 18px;
}

.role-button {
  border: 0;
  border-radius: 20px;
  padding: 32px 18px;
  background: #f3f6fb;
  color: #17266b;
  cursor: pointer;
  font-size: 18px;
  font-weight: 800;
  transition: .2s;
}

.role-button:hover {
  transform: translateY(-4px);
  box-shadow:
    0 12px 25px rgba(0,0,0,.12);
}

.role-icon {
  display: block;
  font-size: 42px;
  margin-bottom: 12px;
}


/* =====================================================
   LOGIN
===================================================== */

.login-box {
  max-width: 450px;
  margin: auto;
}

h1 {
  margin: 0;
  text-align: center;
  color: #17266b;
}

.subtitle {
  text-align: center;
  color: #718096;
  margin: 10px 0 28px;
}

input,
select {
  width: 100%;
  padding: 13px 14px;
  border:
    1px solid #d7dee9;
  border-radius: 11px;
  font-size: 15px;
  outline: none;
  background: white;
}

input:focus,
select:focus {
  border-color: #315ca8;
  box-shadow:
    0 0 0 3px rgba(49,92,168,.10);
}

.primary-button,
.secondary-button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 11px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
}

.primary-button {
  background: #17266b;
  color: white;
}

.secondary-button {
  background: #e8edf4;
  color: #24324a;
}

.status {
  margin-top: 15px;
  padding: 12px;
  border-radius: 11px;
  background: #f3f6fa;
  text-align: center;
}


/* =====================================================
   APP
===================================================== */

.app-layout {
  min-height: 100vh;
  display: flex;
}

.sidebar {
  width: 245px;
  background:
    linear-gradient(
      180deg,
      #17266b,
      #102050
    );
  color: white;
  padding: 22px 15px;
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  overflow-y: auto;
}

.sidebar-brand {
  font-size: 24px;
  font-weight: 900;
  padding: 10px 12px 5px;
}

.sidebar-subtitle {
  font-size: 12px;
  opacity: .7;
  padding: 0 12px 22px;
}

.sidebar-section {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  opacity: .55;
  padding: 13px 12px 7px;
}

.nav-button {
  width: 100%;
  border: none;
  background: transparent;
  color: white;
  text-align: left;
  padding: 13px 14px;
  border-radius: 11px;
  margin-bottom: 5px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
}

.nav-button:hover {
  background: rgba(255,255,255,.10);
}

.nav-button.active {
  background: rgba(255,255,255,.18);
}

.logout-button {
  margin-top: 20px;
}

.main-content {
  margin-left: 245px;
  width: calc(100% - 245px);
  padding: 24px;
}

.topbar {
  background: white;
  border-radius: 17px;
  padding: 18px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow:
    0 5px 22px rgba(20,43,75,.07);
  margin-bottom: 18px;
}

.top-title {
  font-size: 23px;
  font-weight: 900;
  color: #17266b;
}

.role-badge {
  background: #edf2ff;
  color: #17266b;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 800;
}

.content-card {
  background: transparent;
}


/* =====================================================
   DASHBOARD HERO
===================================================== */

.dashboard-header {
  background:
    linear-gradient(
      135deg,
      #17266b,
      #285899
    );
  color: white;
  border-radius: 20px;
  padding: 25px;
  margin-bottom: 18px;
  box-shadow:
    0 10px 30px rgba(23,38,107,.18);
}

.dashboard-header h2 {
  margin: 0 0 5px;
  font-size: 25px;
}

.dashboard-header p {
  margin: 0;
  opacity: .78;
}

.dashboard-controls {
  display: flex;
  gap: 12px;
  align-items: end;
  flex-wrap: wrap;
  margin-top: 20px;
}

.control {
  flex: 1;
  min-width: 220px;
}

.control label {
  display: block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .8px;
  opacity: .75;
  margin-bottom: 6px;
}

.control select {
  border: none;
}

.event-pill {
  display: inline-flex;
  align-items: center;
  padding: 9px 15px;
  border-radius: 20px;
  background: rgba(255,255,255,.15);
  color: white;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

.dashboard-section {
  background: white;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 5px 20px rgba(20,43,75,.07);
  margin-top: 18px;
}

.dashboard-section-title {
  margin: 0 0 16px;
  color: #17266b;
  font-size: 20px;
  font-weight: 900;
}


/* =====================================================
   STAT CARDS
===================================================== */

.stats-grid {
  display: grid;
  grid-template-columns:
    repeat(4,1fr);
  gap: 14px;
  margin-bottom: 18px;
}

.stat-card {
  background: white;
  border-radius: 17px;
  padding: 20px;
  box-shadow:
    0 5px 20px rgba(20,43,75,.07);
}

.stat-label {
  color: #718096;
  font-size: 12px;
  font-weight: 700;
}

.stat-number {
  font-size: 30px;
  font-weight: 900;
  margin-top: 6px;
  color: #17266b;
}

.stat-sub {
  font-size: 12px;
  margin-top: 4px;
  color: #718096;
}


/* =====================================================
   YEAR CARDS
===================================================== */

.year-grid {
  display: grid;
  grid-template-columns:
    repeat(4,1fr);
  gap: 16px;
}

.year-card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  box-shadow:
    0 5px 20px rgba(20,43,75,.07);
}

.year-title {
  font-size: 20px;
  font-weight: 900;
  color: #17266b;
  margin-bottom: 5px;
}

.year-summary {
  color: #718096;
  font-size: 12px;
  margin-bottom: 15px;
}

.progress {
  height: 9px;
  background: #edf0f5;
  border-radius: 20px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: #39a86b;
  border-radius: 20px;
}

.section-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

.section-table th,
.section-table td {
  padding: 9px 5px;
  border-bottom: 1px solid #edf0f4;
  font-size: 12px;
}

.section-table th {
  color: #718096;
  text-align: left;
}

.section-table td:last-child,
.section-table th:last-child {
  text-align: right;
}


/* =====================================================
   NOT YET HELD
===================================================== */

.not-held {
  background:
    #f1f3f6;
  border:
    1px solid #dce1e8;
  color:
    #6b7280;
  border-radius: 16px;
  padding: 22px;
  text-align: center;
  margin-bottom: 18px;
}

.not-held-icon {
  font-size: 32px;
  margin-bottom: 5px;
}


/* =====================================================
   ATTENDANCE TABLE
===================================================== */

.attendance-card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  box-shadow:
    0 5px 20px rgba(20,43,75,.07);
  margin-bottom: 18px;
}

.table-wrapper {
  width: 100%;
  overflow-x: auto;
  border-radius: 11px;
  border: 1px solid #e0e5ec;
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 700px;
}

th,
td {
  padding: 9px;
  border-bottom: 1px solid #e6eaf0;
  font-size: 12px;
  text-align: left;
}

th {
  background: #17266b;
  color: white;
  position: sticky;
  top: 0;
  z-index: 2;
}

.status-present {
  background: #dcf5e6 !important;
  color: #167344;
  font-weight: 800;
  text-align: center;
}

.status-absent {
  background: #fde0e0 !important;
  color: #a82222;
  font-weight: 800;
  text-align: center;
}

.status-future {
  background: #e9edf2 !important;
  color: #737b87;
  font-weight: 700;
  text-align: center;
}

.status-empty {
  text-align: center;
  color: #9aa3af;
}


/* =====================================================
   SETTINGS
===================================================== */

.section-heading {
  margin-bottom: 5px;
  color: #17266b;
}

.section-description {
  margin-top: 0;
  color: #718096;
  font-size: 13px;
}

.settings-toolbar {
  display: flex;
  justify-content: flex-end;
  margin: 15px 0;
}

.add-button {
  border: none;
  background: #17266b;
  color: white;
  padding: 12px 17px;
  border-radius: 11px;
  cursor: pointer;
  font-weight: 800;
}

.settings-list {
  display: grid;
  gap: 14px;
}

.setting-card {
  background: white;
  border-radius: 17px;
  padding: 18px;
  box-shadow:
    0 5px 18px rgba(20,43,75,.06);
}

.setting-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 13px;
}

.setting-title {
  font-size: 16px;
  font-weight: 900;
  color: #17266b;
}

.row-badge {
  background: #edf2ff;
  color: #315ca8;
  padding: 5px 9px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 800;
}

.setting-grid {
  display: grid;
  grid-template-columns:
    repeat(4,1fr);
  gap: 10px;
}

.setting-field label {
  display: block;
  font-size: 11px;
  font-weight: 800;
  color: #718096;
  margin-bottom: 5px;
}

.save-button {
  background: #17266b;
  color: white;
  border: none;
  border-radius: 9px;
  padding: 10px 16px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 12px;
}


/* =====================================================
   MODAL
===================================================== */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(10,25,55,.55);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  z-index: 100;
}

.modal-box {
  background: white;
  width: 100%;
  max-width: 520px;
  border-radius: 20px;
  padding: 24px;
  box-shadow:
    0 20px 60px rgba(0,0,0,.2);
}

.modal-box h2 {
  margin-top: 0;
  color: #17266b;
}

.form-row {
  margin-bottom: 12px;
}

.form-row label {
  display: block;
  font-size: 12px;
  font-weight: 800;
  color: #718096;
  margin-bottom: 5px;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

.modal-actions button {
  flex: 1;
}


/* =====================================================
   CAMERA
===================================================== */

#reader {
  width: 100%;
  max-width: 600px;
  margin: auto;
  border-radius: 14px;
  overflow: hidden;
  background: black;
}

#reader video {
  width: 100% !important;
  height: auto !important;
  display: block;
}

.result {
  display: none;
  margin-top: 15px;
  padding: 16px;
  border-radius: 12px;
}

.success {
  display: block;
  background: #e8f7ed;
  border: 1px solid #9bd5ad;
}

.warning {
  display: block;
  background: #fff7df;
  border: 1px solid #e5c86a;
}

.error {
  display: block;
  background: #fdeaea;
  border: 1px solid #e0a0a0;
}

.student-name {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 10px;
}

.detail {
  margin: 5px 0;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 900px) {

  .stats-grid {
    grid-template-columns:
      repeat(2,1fr);
  }

  .year-grid {
    grid-template-columns: 1fr;
  }

  .setting-grid {
    grid-template-columns:
      repeat(2,1fr);
  }

}

@media (max-width: 750px) {

  .sidebar {
    width: 100%;
    height: auto;
    position: relative;
  }

  .app-layout {
    display: block;
  }

  .main-content {
    margin-left: 0;
    width: 100%;
    padding: 12px;
  }

  .sidebar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
  }

  .sidebar-brand,
  .sidebar-subtitle {
    width: 100%;
  }

  .sidebar-section {
    display: none;
  }

  .nav-button {
    width: auto;
    margin-right: 5px;
  }

  .role-grid {
    grid-template-columns: 1fr;
  }

  .setting-grid {
    grid-template-columns: 1fr;
  }

  .stats-grid {
    grid-template-columns: 1fr 1fr;
  }

  .topbar {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

}



/* =====================================================
   STUDENT TALAAN ID DIRECTORY / ID CARD
===================================================== */

.talaan-id-toolbar {
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  margin:18px 0 20px;
  padding:16px;
  background:#f5f7fb;
  border:1px solid #e2e8f0;
  border-radius:16px;
}

.talaan-id-toolbar .left {
  min-width:220px;
}

.talaan-id-toolbar .title {
  font-weight:900;
  color:#17266b;
  font-size:16px;
}

.talaan-id-toolbar .hint {
  color:#718096;
  font-size:12px;
  margin-top:4px;
}

.talaan-id-actions {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.talaan-id-action {
  border:0;
  border-radius:10px;
  padding:10px 13px;
  background:#17266b;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.talaan-id-action.secondary {
  background:#e8edf4;
  color:#24324a;
}

.talaan-id-action:hover {
  transform:translateY(-1px);
}

.talaan-id-year,
.talaan-id-course,
.talaan-id-section {
  background:#fff;
  border:1px solid #e0e7f0;
  border-radius:16px;
  margin:10px 0;
  overflow:hidden;
}

.talaan-id-year > summary,
.talaan-id-course > summary,
.talaan-id-section > summary {
  cursor:pointer;
  list-style:none;
}

.talaan-id-year > summary::-webkit-details-marker,
.talaan-id-course > summary::-webkit-details-marker,
.talaan-id-section > summary::-webkit-details-marker {
  display:none;
}

.talaan-id-year > summary {
  padding:16px 18px;
  font-size:17px;
  font-weight:900;
  color:#17266b;
  background:#f7f9fc;
}

.talaan-id-course > summary {
  padding:13px 16px;
  font-weight:900;
  color:#263b73;
}

.talaan-id-section > summary {
  padding:11px 14px;
  font-weight:800;
  color:#34445f;
}

.talaan-id-summary-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.talaan-id-summary-meta {
  color:#718096;
  font-size:12px;
  font-weight:700;
}

.talaan-id-section-body,
.talaan-id-course-body,
.talaan-id-year-body {
  padding:0 14px 14px;
}

.talaan-id-student {
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
  padding:12px 4px;
  border-top:1px solid #edf1f6;
}

.talaan-id-student-name {
  font-weight:900;
  color:#17266b;
}

.talaan-id-student-meta {
  margin-top:3px;
  font-size:12px;
  color:#718096;
}

.talaan-id-student-actions {
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  justify-content:flex-end;
}

.talaan-id-student-actions button {
  border:0;
  border-radius:9px;
  padding:8px 10px;
  cursor:pointer;
  font-size:12px;
  font-weight:800;
  background:#17266b;
  color:#fff;
}

.talaan-id-student-actions button.secondary {
  background:#e8edf4;
  color:#24324a;
}

.talaan-id-empty {
  padding:12px 4px;
  color:#718096;
  font-size:13px;
}

.talaan-id-card-preview {
  width:min(100%,430px);
  margin:0 auto;
  background:#fff;
  border-radius:20px;
  box-shadow:0 18px 50px rgba(19,45,85,.18);
  overflow:hidden;
}

.talaan-id-card-preview img {
  display:block;
  width:100%;
  height:auto;
}

.talaan-id-modal {
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(10,20,45,.62);
}

.talaan-id-modal-card {
  width:min(94vw,520px);
  max-height:94vh;
  overflow:auto;
  background:#fff;
  border-radius:22px;
  padding:18px;
  box-shadow:0 25px 70px rgba(0,0,0,.28);
}

.talaan-id-modal-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}

.talaan-id-modal-title {
  color:#17266b;
  font-weight:900;
  font-size:18px;
}

.talaan-id-close {
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#edf1f6;
  color:#24324a;
  font-size:22px;
  cursor:pointer;
}

.talaan-id-modal-actions {
  display:flex;
  gap:9px;
  margin-top:14px;
}

.talaan-id-modal-actions button {
  flex:1;
  border:0;
  border-radius:11px;
  padding:12px;
  font-weight:900;
  cursor:pointer;
  background:#17266b;
  color:#fff;
}

.talaan-id-modal-actions button.secondary {
  background:#e8edf4;
  color:#24324a;
}

.talaan-id-profile-wrap {
  display:flex;
  justify-content:center;
  margin-top:12px;
}

.talaan-id-profile-card {
  width:min(100%,430px);
}

@media (max-width:650px) {
  .talaan-id-student {
    grid-template-columns:1fr;
  }
  .talaan-id-student-actions {
    justify-content:flex-start;
  }
}

</style>

</head>


<body>


<!-- =====================================================
     WELCOME
===================================================== -->

<section
  id="welcomeScreen"
  class="screen"
>

  <div class="card welcome-card">

    <div class="talaan-welcome-logo-strip">
      <img id="welcomeTalaanLogo" alt="TALAAN">
      <img id="welcomeSsgLogo" alt="SSG">
    </div>

    <div class="welcome-title">
      SSG TALAAN
    </div>

    <div class="welcome-subtitle">
      LVCC Caloocan Student Attendance System
    </div>

    <div class="role-grid">

      <button
        class="role-button"
        onclick="openSecretaryLogin()"
      >
        <span class="role-icon">🔐</span>
        Secretary
      </button>

      <button
        class="role-button"
        onclick="openDashboard('Teacher/Student')"
      >
        <span class="role-icon">👥</span>
        Teacher/Student
      </button>

    </div>

  </div>

</section>


<!-- =====================================================
     LOGIN
===================================================== -->

<section
  id="loginScreen"
  class="screen hidden"
>

  <div class="card login-box">

    <h1>
      Secretary Login
    </h1>

    <div class="subtitle">
      Enter your authorized Secretary access code.
    </div>

    <input
      id="secretaryCode"
      type="password"
      placeholder="Secretary Access Code"
      autocomplete="off"
    >

    <button
      class="primary-button"
      onclick="secretaryLogin()"
    >
      🔐 LOGIN
    </button>

    <button
      class="secondary-button"
      onclick="backToWelcome()"

/* =====================================================
   GOOGLE APPS SCRIPT BRIDGE
===================================================== */

const API_URL =
  'https://script.google.com/a/macros/laverdad.edu.ph/s/AKfycbzleAsY0Gc8MJuIcgE11cDDkZCrOag5BQAq5ZjBcclBxGAp9rTF_XtNTptNlqQhZj1wTQ/exec';

let currentRole = null;
let dashboardData = null;
let secretaryCodeSession = '';
let scanner = null;
let scanning = false;
let processing = false;
let scannerRestartTimer = null;


function apiRequest(action, params = {}) {

  return new Promise(function(resolve, reject) {

    if (!API_URL || API_URL.indexOf('PASTE_YOUR_') === 0) {

      reject(new Error(
        'Apps Script Web App URL is not configured in INDEX.HTML.'
      ));

      return;

    }


    const callbackName =
      '__talaanCallback_' +
      Date.now() + '_' +
      Math.random().toString(36).slice(2);


    const script =
      document.createElement('script');


    const query =
      new URLSearchParams();


    query.set('action', action);
    query.set('callback', callbackName);


    Object.keys(params || {}).forEach(function(key) {

      const value =
        params[key];

      if (
        value !== undefined &&
        value !== null
      ) {

        query.set(
          key,
          String(value)
        );

      }

    });


    let finished = false;


    const cleanup = function() {

      finished = true;

      try {
        delete window[callbackName];
      }

      catch (e) {
        window[callbackName] = undefined;
      }


      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    };


    const timer =
      setTimeout(function() {

        if (finished) return;

        cleanup();

        reject(new Error(
          'Apps Script API timed out. Check the Web App deployment and URL.'
        ));

      }, 30000);


    window[callbackName] =
      function(data) {

        if (finished) return;

        clearTimeout(timer);

        cleanup();

        resolve(data);

      };


    script.onerror =
      function() {

        if (finished) return;

        clearTimeout(timer);

        cleanup();

        reject(new Error(
          'Could not connect to the Apps Script Web App. Check the /exec URL and deployment access.'
        ));

      };


    script.src =
      API_URL.replace(/\/$/, '') +
      '?' +
      query.toString();


    document.head.appendChild(script);

  });

}

/* =====================================================
   NORMALIZE OVERALL DASHBOARD YEARS
===================================================== */

function normalizeDashboardYears(years) {

  if (Array.isArray(years)) {

    return years
      .filter(function(item) {

        return item &&
          typeof item === 'object';

      })
      .sort(function(a, b) {

        return Number(
          a.yearLevel ||
          a.year ||
          0
        ) -
        Number(
          b.yearLevel ||
          b.year ||
          0
        );

      });

  }


  if (
    years &&
    typeof years === 'object'
  ) {

    return ['1','2','3','4']
      .map(function(level) {

        const item =
          years[level] ||
          years[Number(level)] ||
          {};


        return {

          yearLevel:
            String(
              item.yearLevel ||
              item.year ||
              level
            ),

          totalStudents:
            Number(
              item.totalStudents ??
              item.total ??
              0
            ),

          present:
            Number(
              item.present ||
              0
            ),

          absent:
            Number(
              item.absent ||
              0
            ),

          notYetHeld:
            Number(
              item.notYetHeld ??
              item.notYet ??
              0
            ),

          rate:
            Number(
              item.rate ??
              item.percentage ??
              0
            ),

          percentage:
            Number(
              item.percentage ??
              item.rate ??
              0
            ),

          sections:
            Array.isArray(
              item.sections
            )
              ? item.sections
              : []

        };

      });

  }


  return [];

}


function renderYearCard(year) {

  const level =
    String(
      year.yearLevel ||
      year.year ||
      ''
    );


  const rate =
    Number(
      year.rate ??
      year.percentage ??
      0
    );


  const label =
    level === '1'
      ? '1ST YEAR'
      : level === '2'
        ? '2ND YEAR'
        : level === '3'
          ? '3RD YEAR'
          : '4TH YEAR';


  return `

    <div class="year-card">

      <div class="year-title">
        ${label}
      </div>

      <div class="year-summary">
        ${rate.toFixed(2)}%
      </div>

      <div class="progress">

        <div
          class="progress-fill"
          style="width:${Math.min(100, rate)}%"
        ></div>

      </div>

    </div>

  `;

}

/* =====================================================
   ATTENDANCE TABLE
===================================================== */

function createAttendanceTable(
  data
) {

  if (
    !data ||
    !data.length
  ) {

    return '<p>No attendance data.</p>';

  }


  const today =
    startOfToday();


  let html =
    '<table><thead><tr>';


  data[0]
    .forEach(
      function(header) {

        html +=
          '<th>' +
          escapeHtml(header) +
          '</th>';

      }
    );


  html +=
    '</tr></thead><tbody>';


  for (
    let r = 1;
    r < data.length;
    r++
  ) {

    html +=
      '<tr>';


    data[r]
      .forEach(
        function(cell, c) {

          const value =
            String(
              cell || ''
            ).trim();


          let className =
            '';


          if (
            value.toUpperCase() ===
            'PRESENT'
          ) {

            className =
              'status-present';

          }

          else if (
            value.toUpperCase() ===
            'ABSENT'
          ) {

            className =
              'status-absent';

          }

          else {

            const header =
              data[0][c];


            const date =
              parseClientDate(
                header
              );


            if (
              date &&
              date > today
            ) {

              className =
                'status-future';

            }

            else {

              className =
                'status-empty';

            }

          }


          html += `

            <td
              class="${className}"
            >

              ${escapeHtml(value)}

            </td>

          `;

        }
      );


    html +=
      '</tr>';

  }


  html +=
    '</tbody></table>';


  return html;

}

   AUTOMATIC CAMERA START
===================================================== */

function openScanner() {

  if (
    currentRole !== 'Secretary'
  ) {

    return;

  }


  clearTimeout(
    scannerRestartTimer
  );


  setActiveNav(
    'navScanner'

  const content =
    document.getElementById(
      'dashboardContent'
    );


  content.innerHTML = `

      </h2>

        Secretary-only scanner. The camera will open automatically.
      </p>


      <div id="reader"></div>


      <button
        id="startScannerButton"
        class="primary-button"
        onclick="startScanner()"
      >
        📷 START QR SCANNER
      </button>


      <button
        class="secondary-button"
        onclick="stopScanner()"
      >
        CLEAR SCANNER
      </button>


      <div
        id="scanLoading"
        class="status"
      >
        📷 Starting camera automatically...
      </div>


      <div
        id="scanResult"
        class="result"
      ></div>

    </div>

  `;


  /*
   * Give the browser a short moment to render #reader
   * before requesting camera permission.
   */
  scannerRestartTimer =

        if (
          currentRole === 'Secretary'
        ) {

          startScanner();

        }

      },

    );

}


/* =====================================================
   START SCANNER
===================================================== */

async function startScanner() {

  if (scanning || processing) {
    return;
  }

  const reader =
    document.getElementById('reader');

  const loading =
    document.getElementById('scanLoading');

  if (!reader) {
    return;
  }

  try {

    if (loading) {
      loading.textContent =
        '📷 Requesting camera access...';
    }

    scanner =
      new Html5Qrcode('reader');

    await scanner.start(

      {
        facingMode: 'environment'
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0
      },

      function(decodedText) {

        onScanSuccess(decodedText);

      },

      function(errorMessage) {

        // Ignore normal QR scanning frame errors.

      }

    );

    scanning = true;

    if (loading) {
      loading.textContent =
        '📷 CAMERA ACTIVE — Point the camera at the student QR code.';
    }

  }

  catch (error) {

    scanning = false;

    if (scanner) {

      try {
        await scanner.clear();
      }
      catch (e) {}

      scanner = null;

    }

    let message =
      'Unable to open the camera.';

    if (
      error &&
      error.message
    ) {

      message +=
        ' ' +
        error.message;

    }

    if (loading) {
      loading.textContent =
        message;
    }

    showScanError(message);

  }

}


/* =====================================================
   STOP SCANNER
===================================================== */

async function stopScanner(showMessage = true) {

  processing = false;

  if (scanner) {

    try {

      if (scanning) {
        await scanner.stop();
      }

    }

    catch (error) {
      console.log(
        'Scanner stop:',
        error
      );
    }

    try {
      await scanner.clear();
    }

    catch (error) {
      console.log(
        'Scanner clear:',
        error
      );
    }

  }

  scanner = null;
  scanning = false;

  if (!showMessage) {
    return;
  }

  const loading =
    document.getElementById(
      'scanLoading'
    );

  if (loading) {

    loading.textContent =
      'Scanner stopped.';

  }

}


/* =====================================================
   RESTART SCANNER
===================================================== */

function restartScannerAfterResult() {

  clearTimeout(
    scannerRestartTimer
  );


  if (
    currentRole !== 'Secretary'
  ) {

    return;

  }


  const reader =
    document.getElementById(
      'reader'
    );


  if (!reader) {
    return;
  }


  const loading =
    document.getElementById(
      'scanLoading'
    );


  if (loading) {

    loading.textContent =
      '📷 Ready. Starting camera again...';

  }


  scannerRestartTimer =
    setTimeout(
      function() {

        if (
          currentRole === 'Secretary' &&
          document.getElementById('reader')
        ) {

          startScanner();

        }

      },
      1500
    );

}


/* =====================================================
   QR SUCCESS
===================================================== */

async function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  if (!scanner || !scanning) {
    return;
  }

  processing = true;

  const loading =
    document.getElementById('scanLoading');

  const result =
    document.getElementById('scanResult');

  if (loading) {
    loading.textContent =
      '⏳ QR detected. Processing attendance...';
  }

  /*
   * PAUSE CAMERA TEMPORARILY
   * HINDI NATIN I-STOP.
   */
  try {

    if (scanner) {
      scanner.pause(true);
    }

  }
  catch (e) {
    console.log('Scanner pause:', e);
  }


  try {

    const data =
      await apiRequest(
        'record',
        {
          qrText: decodedText
        }
      );

    displayResult(data);

  }

  catch (error) {

    showScanError(
      error.message
    );

  }


  /*
   * WAIT A LITTLE SO THE RESULT CAN BE SEEN,
   * THEN AUTOMATICALLY RESUME SCANNING.
   */
  setTimeout(
    async function() {

      processing = false;

      if (
        scanner &&
        scanning
      ) {

        try {

          scanner.resume();

          if (loading) {

            loading.textContent =
              '📷 CAMERA ACTIVE — Ready for next QR code.';

          }

        }

        catch (error) {

          console.log(
            'Scanner resume error:',
            error
          );

          /*
           * If resume fails, restart camera automatically.
           */
          await restartScannerAutomatically();

        }

      }

    },
    1200
  );

}

  async function restartScannerAutomatically() {

  if (processing) {
    return;
  }

  try {

    if (scanner) {

      try {
        if (scanning) {
          await scanner.stop();
        }
      }
      catch (e) {}

      try {
        await scanner.clear();
      }
      catch (e) {}

    }

  }
  catch (e) {}

  scanner = null;
  scanning = false;

  setTimeout(function() {

    if (
      currentRole === 'Secretary' &&
      document.getElementById('reader')
    ) {

      startScanner();

    }

  }, 300);

}


/* =====================================================
   SCAN RESULT
===================================================== */

function displayResult(
  data
) {

  const result =
    document.getElementById(
      'scanResult'
    );


  if (!result) {
    return;
  }


  result.style.display =
    'block';


  if (
    !data ||
    data.success === false
  ) {

    showScanError(
      data &&
      (
        data.error ||
        data.message
      )
        ? (
            data.error ||
            data.message
          )
        : 'Unable to process attendance.'
    );

    return;

  }


  if (
    data.decision ===
    'PRESENT'
  ) {

    result.className =
      'result success';


    result.innerHTML = `

      <div class="student-name">
        🟢 PRESENT
      </div>

      <div class="detail">
        <strong>Student:</strong>
        ${escapeHtml(data.student)}
      </div>

      <div class="detail">
        <strong>Section:</strong>
        ${escapeHtml(data.section)}
      </div>

      <div class="detail">
        <strong>Event:</strong>
        ${escapeHtml(data.event)}
      </div>

      <div class="detail">
        <strong>Date:</strong>
        ${escapeHtml(data.date)}
      </div>

      <div class="detail">
        <strong>Cut-off:</strong>
        ${escapeHtml(data.cutoff)}
      </div>

    `;

    return;

  }


  if (
    data.decision ===
    'ABSENT'
  ) {

    result.className =
      'result warning';


    result.innerHTML = `

      <div class="student-name">
        🔴 ABSENT
      </div>

      <div class="detail">
        <strong>Student:</strong>
        ${escapeHtml(data.student)}
      </div>

      <div class="detail">
        <strong>Section:</strong>
        ${escapeHtml(data.section)}
      </div>

      <div class="detail">
        <strong>Event:</strong>
        ${escapeHtml(data.event)}
      </div>

      <div class="detail">
        <strong>Date:</strong>
        ${escapeHtml(data.date)}
      </div>

    `;

    return;

  }


  if (
    data.decision ===
    'ALREADY_RECORDED'
  ) {

    result.className =
      'result warning';


    result.innerHTML = `

      <div class="student-name">
        ⚠️ ALREADY RECORDED
      </div>

      <div class="detail">
        <strong>Student:</strong>
        ${escapeHtml(data.student)}
      </div>

      <div class="detail">
        <strong>Recorded:</strong>
        ${escapeHtml(data.currentValue)}
      </div>

    `;

    return;

  }


  if (
    data.decision ===
    'NOT_YET_HELD'
  ) {

    result.className =
      'result warning';


    result.innerHTML = `

      <div class="student-name">
        ⚪ EVENT NOT YET HELD
      </div>

      <div class="detail">
        <strong>Event:</strong>
        ${escapeHtml(data.event)}
      </div>

      <div class="detail">
        <strong>Date:</strong>
        ${escapeHtml(data.date)}
      </div>

    `;

    return;

  }


  result.className =
    'result success';


  result.innerHTML = `

    <div class="student-name">
      ✅ SUCCESS
    </div>

    <div class="detail">
      ${escapeHtml(
        data.action ||
        'Attendance processed.'
      )}
    </div>

  `;

}


/* =====================================================
   SCAN ERROR
===================================================== */

function showScanError(
  message
) {

  const result =
    document.getElementById(
      'scanResult'
    );


  if (!result) {
    return;
  }


  result.style.display =

  result.innerHTML = `

    </div>

    <div class="detail">
      ${escapeHtml(message)}
    </div>

  `;

}

/* =====================================================
   DATE HELPERS
===================================================== */

function parseClientDate(
  text
) {

  const value =
    String(
      text || ''
    ).trim();


  if (!value) {
    return null;
  }


  let date =
    new Date(value);


  if (
    !isNaN(
      date.getTime()
    )
  ) {

    date.setHours(
      0,0,0,0
    );

    return date;

  }


  const match =
    value.match(
      /^([A-Za-z]+)\s+(\d{1,2})(?:,\s*(\d{4}))?$/
    );


  if (!match) {
    return null;
  }


  const year =
    match[3]
      ? Number(match[3])
      : new Date().getFullYear();


  date =
    new Date(
      match[1] +
      ' 1, ' +
      year
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return null;

  }


  date =
    new Date(
      year,
      date.getMonth(),
      Number(match[2])
    );


  date.setHours(
    0,0,0,0
  );


  return date;

}


function normalizeDateKey(
  text
) {

  const date =
    parseClientDate(
      text
    );


  if (!date) {

    return String(
      text || ''
    )
    .trim()
    .toUpperCase();

  }


  return (
    date.getFullYear() +
    '-' +
    String(
      date.getMonth()+1
    ).padStart(2,'0') +
    '-' +
    String(
      date.getDate()
    ).padStart(2,'0')
  );

}


function startOfToday() {

  const d =
    new Date();

  d.setHours(
    0,0,0,0
  );

  return d;

}


/* =====================================================
   HEADER FINDER
===================================================== */

function findHeader(
  headers,
  targets
) {

  const list =
    targets.map(
      x =>
        String(x)
          .trim()
          .toUpperCase()
    );


  for (
    let i = 0;
    i < headers.length;
    i++
  ) {

    if (
      list.indexOf(
        String(
          headers[i] || ''
        )
        .trim()
        .toUpperCase()
      ) !== -1
    ) {

      return i;

    }

  }


  return -1;

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
  value
) {

  return String(
    value || ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}


function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );

}

@media(max-width:700px){.talaan-top-search{order:3;width:100%;max-width:none;margin:10px 0 0}.topbar{flex-wrap:wrap}.talaan-top-search input{min-width:0}.talaan-top-left{max-width:52%}.role-badge{margin-left:auto}}
.talaan-search-row{display:flex;gap:8px;align-items:center;margin:0 0 15px}
.talaan-search-row input{margin:0}
.talaan-search-row button{width:auto;margin:0;padding:13px 16px}
.talaan-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.talaan-mini-stat{background:#f7f9fc;border:1px solid #e7ebf1;border-radius:13px;padding:13px}
.talaan-mini-stat .n{font-size:22px;font-weight:900;color:#17266b}
.talaan-mini-stat .l{font-size:10px;color:#718096;font-weight:800;text-transform:uppercase;margin-top:2px}
.talaan-summary-banner{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 20px rgba(20,43,75,.07);margin-top:18px}
.talaan-summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.talaan-summary-item{padding:15px;border-radius:14px;background:#f7f9fc}
.talaan-summary-item strong{display:block;color:#17266b;font-size:18px}
.talaan-summary-item span{font-size:11px;color:#718096}
.talaan-warning{background:#fde0e0!important;border:1px solid #f2a8a8!important;color:#a82222!important}
.talaan-safe{background:#e8f7ed!important;border:1px solid #a6d8b5!important;color:#167344!important}
.talaan-warning-row td{background:#fff4f4}
.talaan-profile-grid{display:grid;grid-template-columns:1fr 280px;gap:16px}
.talaan-profile-card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 5px 20px rgba(20,43,75,.07)}
.talaan-profile-id{font-size:22px;font-weight:900;color:#17266b;letter-spacing:1px;word-break:break-word}
.talaan-qr-box{display:flex;align-items:center;justify-content:center;min-height:230px}
.talaan-record-list{display:grid;gap:8px;margin-top:14px}
.talaan-record{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;padding:11px 12px;border-radius:11px;background:#f8fafc}
.talaan-record.present{background:#e8f7ed;color:#167344}.talaan-record.absent{background:#fdeaea;color:#a82222}
.talaan-result-card{background:#fff;border-radius:16px;padding:16px;margin-top:12px;box-shadow:0 5px 18px rgba(20,43,75,.06)}
.talaan-result-name{font-weight:900;color:#17266b;font-size:17px}.talaan-result-meta{font-size:12px;color:#718096;margin-top:3px}
.talaan-code-pill{font-family:monospace;font-weight:900;letter-spacing:.5px}
.talaan-logo-strip{display:flex;align-items:center;gap:8px}
.talaan-logo-strip img{height:34px;width:auto;object-fit:contain}
@media(max-width:900px){.talaan-stat-grid{grid-template-columns:repeat(2,1fr)}.talaan-profile-grid{grid-template-columns:1fr}.talaan-summary-grid{grid-template-columns:1fr}.talaan-record{grid-template-columns:1fr}.talaan-header-logo{display:none}.talaan-top-left{padding-left:58px}}

let talaanSession = null;
let authRole = 'Student';
let studentAuthMode = 'login';

function getStoredTalaanSession_() {
  try {
    const raw = localStorage.getItem('talaanSession');
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.token || !parsed.session) return null;
    if (parsed.session.expiresAt && Number(parsed.session.expiresAt) <= Date.now()) return null;
    return parsed;
  } catch (e) {
    return null;
  }
}

function saveTalaanSession_(token, session) {
  talaanSession = {token: token, session: session};
  localStorage.setItem('talaanSession', JSON.stringify(talaanSession));
}

function clearTalaanSession_() {
  talaanSession = null;
  localStorage.removeItem('talaanSession');
  secretaryCodeSession = '';
}

function sessionToken_() {
  return talaanSession && talaanSession.token ? talaanSession.token : '';
}

function currentSession_() {
  return talaanSession && talaanSession.session ? talaanSession.session : {};
}

/* Replace the original bridge so every protected request carries the session token. */
function apiRequest(action, params = {}) {
  return new Promise(function(resolve, reject) {
    if (!API_URL || API_URL.indexOf('PASTE_YOUR_') === 0) {
      reject(new Error('Apps Script Web App URL is not configured in INDEX.HTML.'));
      return;
    }

    const callbackName = '__talaanCallback_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const query = new URLSearchParams();
    query.set('action', action);
    query.set('callback', callbackName);

    const merged = Object.assign({}, params || {});
    if (!merged.token && sessionToken_()) merged.token = sessionToken_();

    Object.keys(merged).forEach(function(key) {
      const value = merged[key];
      if (value !== undefined && value !== null) query.set(key, String(value));
    });

    let finished = false;
    const cleanup = function() {
      finished = true;
      try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    };

    const timer = setTimeout(function() {
      if (finished) return;
      cleanup();
      reject(new Error('Apps Script API timed out. Check the Web App deployment and URL.'));
    }, 30000);

    window[callbackName] = function(data) {
      if (finished) return;
      clearTimeout(timer);
      cleanup();
      resolve(data);
    };

    script.onerror = function() {
      if (finished) return;
      clearTimeout(timer);
      cleanup();
      reject(new Error('Could not connect to the Apps Script Web App. Check the /exec URL and deployment access.'));
    };

    script.src = API_URL.replace(/\/$/, '') + '?' + query.toString();
    document.head.appendChild(script);
  });
}

function injectTalaanBranding_() {
  // Use only the small two-logo strip already present on the welcome page.
  // Do not inject the large standalone logos.
  const welcomeTalaan = document.getElementById('welcomeTalaanLogo');
  const welcomeSsg = document.getElementById('welcomeSsgLogo');

  if (welcomeTalaan) {
    welcomeTalaan.src = TALAAN_LOGO_DATA;
    welcomeTalaan.alt = 'TALAAN';
  }

  if (welcomeSsg) {
    welcomeSsg.src = SSG_LOGO_DATA;
    welcomeSsg.alt = 'SSG';
  }

  // Keep the small logo strip directly ABOVE the SSG TALAAN title.
  const welcome = document.getElementById('welcomeScreen');
  const card = welcome && welcome.querySelector('.welcome-card');
  const strip = card && card.querySelector('.talaan-welcome-logo-strip');
  const title = card && card.querySelector('.welcome-title');

  if (strip && title && title.previousElementSibling !== strip) {
    card.insertBefore(strip, title);
  }
}

function ensureHamburger_() {
  if (document.getElementById('talaanHamburger')) return;

  const button = document.createElement('button');
  button.id = 'talaanHamburger';
  button.className = 'talaan-hamburger hidden';
  button.type = 'button';
  button.innerHTML = '☰';
  button.setAttribute('aria-label', 'Open menu');
  button.onclick = toggleTalaanMenu_;
  document.body.appendChild(button);

  const backdrop = document.createElement('div');
  backdrop.id = 'talaanMenuBackdrop';
  backdrop.className = 'talaan-menu-backdrop';
  backdrop.onclick = closeTalaanMenu_;
  document.body.appendChild(backdrop);

  const menu = document.createElement('aside');
  menu.id = 'talaanMenu';
  menu.className = 'talaan-menu';
  document.body.appendChild(menu);
}

function toggleTalaanMenu_() {
  const menu = document.getElementById('talaanMenu');
  const backdrop = document.getElementById('talaanMenuBackdrop');
  if (!menu || !backdrop) return;
  const open = menu.classList.toggle('open');
  backdrop.classList.toggle('open', open);
  const button = document.getElementById('talaanHamburger');
  if (button) button.classList.toggle('menu-open', open);
}

function closeTalaanMenu_() {
  const menu = document.getElementById('talaanMenu');
  const backdrop = document.getElementById('talaanMenuBackdrop');
  if (menu) menu.classList.remove('open');
  if (backdrop) backdrop.classList.remove('open');
  const button = document.getElementById('talaanHamburger');
  if (button) button.classList.remove('menu-open');
}

function menuButton_(label, onclick, id, active) {
  return '<button ' + (id ? 'id="' + id + '" ' : '') + 'class="' + (active ? 'active' : '') + '" onclick="' + onclick + '">' + label + '</button>';
}

function renderTalaanMenu_(activeId) {
  ensureHamburger_();
  const menu = document.getElementById('talaanMenu');
  const session = currentSession_();
  const role = session.role || currentRole || '';
  const name = session.name || role;
  const year = session.yearLevel && session.yearLevel !== 'ALL' ? ' • ' + getYearLabelClient_(session.yearLevel) : '';

  let html = '<div class="talaan-menu-head">';
  html += '<button class="close-menu" onclick="closeTalaanMenu_()">×</button>';
  html += '<img class="talaan-menu-logo" src="' + TALAAN_LOGO_DATA + '" alt="TALAAN">';
  html += '<div class="talaan-menu-user">' + escapeHtml(name) + '</div>';
  html += '<div class="talaan-menu-role">' + escapeHtml(role + year) + '</div>';
  html += '</div>';

  html += '<div class="talaan-menu-group">Main</div>';
  html += menuButton_('📊 Overall Dashboard', "talaanNavigate_('dashboard')", 'menuDashboard', activeId === 'dashboard');

  html += '<div class="talaan-menu-group">Attendance</div>';
  if (role === 'Student' || role === 'Teacher') {
    const lvl = session.yearLevel;
    html += menuButton_('📋 ' + getYearLabelClient_(lvl), "talaanNavigate_('attendance','Attendance" + lvl + "')", 'menuAttendanceAssigned', activeId === 'attendance');
  } else {
    ['1','2','3','4'].forEach(function(level) {
      html += menuButton_('📋 ' + getYearLabelClient_(level), "talaanNavigate_('attendance','Attendance" + level + "')", 'menuAttendance' + level, activeId === 'attendance' + level);
    });
  }

  if (role === 'Student') {
    html += '<div class="talaan-menu-group">Personal</div>';
    html += menuButton_('👤 Profile', "talaanNavigate_('profile')", 'menuProfile', activeId === 'profile');
  }

  if (role === 'Secretary' || role === 'Admin' || role === 'Teacher') {
    html += '<div class="talaan-menu-group">Monitoring</div>';
    html += menuButton_('⚠️ Students with Warnings', "talaanNavigate_('warnings')", 'menuWarnings', activeId === 'warnings');
  }

  if (role === 'Secretary') {
    html += '<div class="talaan-menu-group">Secretary</div>';
    html += menuButton_('⚙️ Event Settings', "talaanNavigate_('settings')", 'menuSettings', activeId === 'settings');
    html += menuButton_('🪪 Student TALAAN IDs', "talaanNavigate_('studentdirectory')", 'menuStudentDirectory', activeId === 'studentdirectory');
    html += menuButton_('📷 QR Scanner', "talaanNavigate_('scanner')", 'menuScanner', activeId === 'scanner');
  }

  html += '<div class="talaan-menu-group">Account</div>';
  html += '<button class="danger" onclick="talaanLogout_()">↪ Logout</button>';
  menu.innerHTML = html;

  const hamburger = document.getElementById('talaanHamburger');
  hamburger.classList.remove('hidden');
  hamburger.classList.toggle('menu-open', menu.classList.contains('open'));
}

function getYearLabelClient_(level) {
  const map = {'1':'1ST YEAR','2':'2ND YEAR','3':'3RD YEAR','4':'4TH YEAR'};
  return map[String(level)] || String(level || 'YEAR');
}

function setPage_(html) {
  const content = document.getElementById('dashboardContent');
  if (!content) return;
  content.innerHTML = '<div class="talaan-page">' + html + '</div>';
}

function setActiveNav(id) {
  renderTalaanMenu_(id);
}

document.addEventListener('DOMContentLoaded', function(){ injectTalaanBranding_(); });

function openAuthModal_(role) {
  authRole = role;
  studentAuthMode = 'login';
  injectTalaanBranding_();
  closeTalaanMenu_();

  const existing = document.getElementById('talaanAuthModal');
  if (existing) existing.remove();

  const modal = document.createElement('div');
  modal.id = 'talaanAuthModal';
  modal.className = 'talaan-auth-modal';
  modal.innerHTML = '<div class="talaan-auth-card" onclick="event.stopPropagation()">' +
    '<div class="talaan-auth-logo-strip">' +
      '<img src="' + TALAAN_LOGO_DATA + '" alt="TALAAN">' +
      '<img src="' + SSG_LOGO_DATA + '" alt="SSG">' +
    '</div>' +
    '<div class="talaan-auth-title">SSG TALAAN</div>' +
    '<div class="talaan-auth-sub">Secure attendance access</div>' +
    '<div class="talaan-role-tabs" id="talaanRoleTabs">' +
      '<button data-role="Student" onclick="switchAuthRole_(\'Student\')">Student</button>' +
      '<button data-role="Teacher" onclick="switchAuthRole_(\'Teacher\')">Teacher</button>' +
      '<button data-role="Admin" onclick="switchAuthRole_(\'Admin\')">Admin</button>' +
    '</div>' +
    '<div id="talaanAuthBody"></div>' +
    '<div class="talaan-auth-actions">' +
      '<button class="secondary-button" onclick="closeAuthModal_()">← BACK</button>' +
      '<button class="primary-button" onclick="submitTalaanAuth_()">SUBMIT</button>' +
    '</div>' +
    '<div id="talaanAuthStatus" class="status">Enter your credentials.</div>' +
  '</div>';
  modal.onclick = function(e) { if (e.target === modal) closeAuthModal_(); };
  document.body.appendChild(modal);

  switchAuthRole_(role === 'Secretary' ? 'Secretary' : role);
}

function switchAuthRole_(role) {
  authRole = role;
  const modal = document.getElementById('talaanAuthModal');
  if (!modal) return;

  const tabs = modal.querySelector('#talaanRoleTabs');
  if (tabs) {
    tabs.style.display = role === 'Secretary' ? 'none' : 'grid';
    tabs.querySelectorAll('button').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-role') === role);
    });
  }

  const body = document.getElementById('talaanAuthBody');
  if (!body) return;

  if (role === 'Secretary') {
    body.innerHTML = '<label style="font-size:12px;font-weight:800;color:#718096">SECRETARY ACCESS CODE</label>' +

function switchStudentMode_(mode) {
  studentAuthMode = mode;
  document.getElementById('studentLoginMode')?.classList.toggle('active', mode === 'login');
  document.getElementById('studentCreateMode')?.classList.toggle('active', mode === 'create');
  const pass = document.getElementById('talaanStudentPassword');
  if (pass) pass.autocomplete = mode === 'create' ? 'new-password' : 'current-password';
  const repeatWrap = document.getElementById('talaanRepeatPasswordWrap');
  const repeat = document.getElementById('talaanStudentRepeatPassword');
  if (repeatWrap) repeatWrap.style.display = mode === 'create' ? 'block' : 'none';
  if (repeat) {
    repeat.value = '';
    repeat.autocomplete = mode === 'create' ? 'new-password' : 'off';
  }
  const status = document.getElementById('talaanAuthStatus');
  if (status) status.textContent = mode === 'create' ? 'Your TALAAN ID must exist in the Masterlist.' : 'Enter your student account credentials.';
}

function togglePasswordField_(id, button) {
  const input = document.getElementById(id);
  if (!input) return;
  input.type = input.type === 'password' ? 'text' : 'password';
  if (button) button.textContent = input.type === 'password' ? '👁' : '🙈';
}

function attachEnter_(element) {
  if (!element) return;
  element.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitTalaanAuth_();
    }
  });
}

function closeAuthModal_() {
  const modal = document.getElementById('talaanAuthModal');
  if (modal) modal.remove();
  document.getElementById('welcomeScreen')?.classList.remove('hidden');
  document.getElementById('appScreen')?.classList.add('hidden');
  document.getElementById('loginScreen')?.classList.add('hidden');
}

async function submitTalaanAuth_() {
  const status = document.getElementById('talaanAuthStatus');
  if (status) status.textContent = 'Checking access...';

  try {
    let data;

    if (authRole === 'Secretary') {
      const code = document.getElementById('talaanSecretCode')?.value.trim() || '';
      if (!code) throw new Error('Please enter your Secretary access code.');
      data = await apiRequest('login', {role:'secretary', code:code});
    } else if (authRole === 'Student') {
      const studentId = document.getElementById('talaanStudentId')?.value.trim() || '';
      const password = document.getElementById('talaanStudentPassword')?.value || '';
      if (!studentId) throw new Error('Please enter your Student TALAAN ID.');
      if (!password) throw new Error('Please enter your password.');
      if (studentAuthMode === 'create') {
        const repeatPassword = document.getElementById('talaanStudentRepeatPassword')?.value || '';
        if (!repeatPassword) throw new Error('Please repeat your password.');
        if (password !== repeatPassword) throw new Error('Passwords do not match.');
      }
      data = await apiRequest('studentAuth', {mode:studentAuthMode, studentId:studentId, password:password});
    } else {
      const code = document.getElementById('talaanStaffCode')?.value.trim() || '';
      if (!code) throw new Error('Please enter your authorization code.');
      data = await apiRequest('staffLogin', {code:code});
    }

    if (!data || data.success !== true) throw new Error(data?.error || 'Access denied.');

    saveTalaanSession_(data.token, data.session);
    currentRole = data.session.role;
    secretaryCodeSession = data.session.code || '';
    closeAuthModal_();
    await openDashboard(currentRole, data.session);
  } catch (error) {
    if (status) status.textContent = '❌ ' + (error.message || error);
  }
}

function getStudentCourseClient_(student) {
  const section = String(student.section || '').trim().toUpperCase();
  if (section === 'HCS') return 'HCS';
  if (section === 'ENTREP' || section === 'ENTREPRENEURSHIP') return 'Entrepreneurship';
  if (/^[1-4]A$/.test(section)) return 'Broadcasting';
  if (/^[1-4]B$/.test(section)) return 'Communication';
  if (section.indexOf('BROADCAST') !== -1) return 'Broadcasting';
  if (section.indexOf('COMM') !== -1) return 'Communication';
  return section || 'Other';
}

function getStudentIdSafeFileName_(student) {
  const name = String(student.name || 'Student').trim().replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '');
  const id = String(student.studentId || 'NO_ID').trim().replace(/[^a-z0-9_-]+/gi, '_');
  return 'TALAAN_ID_' + (name || 'Student') + '_' + (id || 'NO_ID') + '.png';
}

function groupStudentDirectory_(students) {
  const years = {};
  ['1','2','3','4'].forEach(function(year) {
    years[year] = {yearLevel:year, courses:{}};
  });

  (students || []).forEach(function(student) {
    const year = String(student.yearLevel || '');
    if (!years[year]) return;
    const course = getStudentCourseClient_(student);
    if (!years[year].courses[course]) {
      years[year].courses[course] = {name:course, sections:{}};
    }
    const section = String(student.section || 'UNSPECIFIED').trim() || 'UNSPECIFIED';
    if (!years[year].courses[course].sections[section]) {
      years[year].courses[course].sections[section] = [];
    }
    years[year].courses[course].sections[section].push(student);
  });

  return years;
}

function getSortedCourseNamesClient_(courses) {
  const order = ['Broadcasting','Communication','HCS','Entrepreneurship','Other'];
  return Object.keys(courses || {}).sort(function(a,b) {
    const ai = order.indexOf(a), bi = order.indexOf(b);
    if (ai !== -1 && bi !== -1) return ai - bi;
    if (ai !== -1) return -1;
    if (bi !== -1) return 1;
    return a.localeCompare(b);
  });
}

function getQrDataUrl_(text, size) {
  return new Promise(function(resolve, reject) {
    if (typeof QRCode === 'undefined') {
      reject(new Error('QR code library is not available.'));
      return;
    }

    const holder = document.createElement('div');
    holder.style.position = 'fixed';
    holder.style.left = '-10000px';
    holder.style.top = '-10000px';
    holder.style.width = size + 'px';
    holder.style.height = size + 'px';
    holder.style.background = '#fff';
    document.body.appendChild(holder);

    try {
      new QRCode(holder, {
        text: String(text || ''),
        width: size,
        height: size,
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch (error) {
      holder.remove();
      reject(error);
      return;
    }

    setTimeout(function() {
      try {
        const canvas = holder.querySelector('canvas');
        if (canvas) {
          const data = canvas.toDataURL('image/png');
          holder.remove();
          resolve(data);
          return;
        }

        const img = holder.querySelector('img');
        if (!img) throw new Error('QR code image was not generated.');
        if (img.complete && img.naturalWidth) {
          const canvas2 = document.createElement('canvas');
          canvas2.width = size;
          canvas2.height = size;
          const ctx = canvas2.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0,0,size,size);
          ctx.drawImage(img,0,0,size,size);
          const data2 = canvas2.toDataURL('image/png');
          holder.remove();
          resolve(data2);
          return;
        }

        img.onload = function() {
          const canvas3 = document.createElement('canvas');
          canvas3.width = size;
          canvas3.height = size;
          const ctx3 = canvas3.getContext('2d');
          ctx3.fillStyle = '#fff';
          ctx3.fillRect(0,0,size,size);
          ctx3.drawImage(img,0,0,size,size);
          const data3 = canvas3.toDataURL('image/png');
          holder.remove();
          resolve(data3);
        };
        img.onerror = function() {
          holder.remove();
          reject(new Error('QR code image could not be loaded.'));
        };
      } catch (error) {
        holder.remove();
        reject(error);
      }
    }, 80);
  });
}

async function buildStudentIdPng_(student) {
  if (!student || !student.studentId) {
    throw new Error('This student does not have a TALAAN ID yet.');
  }

  const width = 900;
  const height = 1200;
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,width,height);

  // Clean TALAAN border.
  ctx.strokeStyle = '#17266b';
  ctx.lineWidth = 10;
  ctx.strokeRect(20,20,width-40,height-40);

  // Soft inner panel.
  ctx.fillStyle = '#f6f8fc';
  ctx.fillRect(50,50,width-100,height-100);

  const logo = await getTalaanLogoImage_();
  const maxLogoW = 300;
  const maxLogoH = 145;
  const scale = Math.min(maxLogoW / logo.width, maxLogoH / logo.height);
  const logoW = logo.width * scale;
  const logoH = logo.height * scale;
  ctx.drawImage(logo,(width-logoW)/2,78,logoW,logoH);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#718096';
  ctx.font = '700 30px Arial, sans-serif';
  ctx.fillText('My TALAAN ID', width/2, 275);

  ctx.fillStyle = '#17266b';
  ctx.font = '900 55px Arial, sans-serif';
  ctx.fillText(String(student.studentId), width/2, 350);

  const qrData = await getQrDataUrl_(student.studentId, 330);
  const qrImg = await new Promise(function(resolve,reject) {
    const img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = function(){ reject(new Error('QR code could not be prepared.')); };
    img.src = qrData;
  });

  const qrSize = 330;
  const qrX = (width-qrSize)/2;
  const qrY = 390;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(qrX-18,qrY-18,qrSize+36,qrSize+36);
  ctx.drawImage(qrImg,qrX,qrY,qrSize,qrSize);

  ctx.fillStyle = '#17266b';
  ctx.font = '900 39px Arial, sans-serif';
  const name = String(student.name || '').toUpperCase();
  const maxNameWidth = 740;
  let nameFont = 39;
  while (nameFont > 25) {
    ctx.font = '900 ' + nameFont + 'px Arial, sans-serif';
    if (ctx.measureText(name).width <= maxNameWidth) break;
    nameFont -= 2;
  }
  ctx.fillText(name, width/2, 825);

  ctx.fillStyle = '#53627a';
  ctx.font = '800 31px Arial, sans-serif';
  ctx.fillText(String(student.section || '').toUpperCase(), width/2, 885);

  ctx.fillStyle = '#718096';
  ctx.font = '700 20px Arial, sans-serif';
  ctx.fillText(getYearLabelClient_(student.yearLevel), width/2, 925);

  ctx.strokeStyle = '#d7dee9';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(155,970);
  ctx.lineTo(745,970);
  ctx.stroke();

  ctx.fillStyle = '#718096';
  ctx.font = '600 18px Arial, sans-serif';
  ctx.fillText('SSG TALAAN • Official Student Identification', width/2, 1015);

  return canvas.toDataURL('image/png');
}

function collectStudentsFromSection_(sectionStudents) {
  return (sectionStudents || []).slice().sort(function(a,b) {

  });
}

async function downloadStudentIdZip_(students, zipName, progressLabel) {
  if (!students || !students.length) {
    alert('No students found in this group.');
    return;
  }
  if (typeof JSZip === 'undefined') {
    alert('ZIP library is not available. Please refresh the page and try again.');
    return;
  }

  const zip = new JSZip();
  const sorted = collectStudentsFromSection_(students);
  const original = document.title;

  try {
    document.title = 'Generating TALAAN IDs...';
    for (let i = 0; i < sorted.length; i++) {
      const student = sorted[i];
      const dataUrl = await buildStudentIdPng_(student);
      const base64 = dataUrl.split(',')[1];
      zip.file(getStudentIdSafeFileName_(student), base64, {base64:true});
      if (progressLabel) progressLabel.textContent = 'Generating ' + (i+1) + ' of ' + sorted.length + ' IDs…';
      await new Promise(function(resolve){ setTimeout(resolve, 0); });
    }

    const blob = await zip.generateAsync({type:'blob', compression:'DEFLATE', compressionOptions:{level:6}});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = zipName + '.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  } catch (error) {
    alert('Unable to create ZIP: ' + (error.message || error));
  } finally {
    document.title = original;
    if (progressLabel) progressLabel.textContent = '';
  }
}

async function downloadStudentIdYearZip_(yearGroup, yearLabel, progressLabel) {
  if (!yearGroup) return;
  if (typeof JSZip === 'undefined') {
    alert('ZIP library is not available. Please refresh the page and try again.');
    return;
  }

  const zip = new JSZip();
  let count = 0;
  const original = document.title;

  try {
    document.title = 'Generating TALAAN IDs...';
    const courseNames = getSortedCourseNamesClient_(yearGroup.courses);
    for (let ci = 0; ci < courseNames.length; ci++) {
      const courseName = courseNames[ci];
      const course = yearGroup.courses[courseName];
      const courseFolder = zip.folder(courseName);
      const sections = Object.keys(course.sections).sort(function(a,b){ return a.localeCompare(b,undefined,{numeric:true}); });

      for (let si = 0; si < sections.length; si++) {
        const section = sections[si];
        const sectionFolder = courseFolder.folder('Section_' + section.replace(/[^a-z0-9_-]+/gi,'_'));
        const students = collectStudentsFromSection_(course.sections[section]);
        for (let i = 0; i < students.length; i++) {
          const dataUrl = await buildStudentIdPng_(students[i]);
          sectionFolder.file(getStudentIdSafeFileName_(students[i]), dataUrl.split(',')[1], {base64:true});
          count++;
          if (progressLabel) progressLabel.textContent = 'Generating ' + count + ' IDs…';
          await new Promise(function(resolve){ setTimeout(resolve,0); });
        }
      }
    }

    const blob = await zip.generateAsync({type:'blob', compression:'DEFLATE', compressionOptions:{level:6}});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'TALAAN_IDs_' + yearLabel.replace(/[^a-z0-9]+/gi,'_') + '.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  } catch (error) {
    alert('Unable to create year ZIP: ' + (error.message || error));
  } finally {
    document.title = original;
    if (progressLabel) progressLabel.textContent = '';
  }
}

  const event=document.getElementById('newEvent')?.value.trim()||'';
  const date=document.getElementById('newDate')?.value.trim()||'';
  const cutoff=document.getElementById('newCutoff')?.value.trim()||'';
  const status=document.getElementById('newStatus')?.value.trim()||'';
  if (!event || !date) { alert('Please provide the event title and date.'); return; }
  try {
    const result=await apiRequest('addEvent',{event:event,date:date,cutoff:cutoff,status:status});
    if(!result || result.success!==true) throw new Error(result?.error||'Unable to add event.');
    alert('✅ New event added successfully.');
    document.getElementById('newEvent').value='';document.getElementById('newDate').value='';document.getElementById('newCutoff').value='';
    closeAddEvent();await refreshDashboardData();showSettings();
  } catch(error){alert('❌ Unable to add event.\n\n'+error.message);}
}

async function refreshDashboardData() {
  const data = await apiRequest('dashboard');
  if (data && data.success === true) dashboardData=data;
}

function openScanner() {
  if (currentRole !== 'Secretary') return;
  renderTalaanMenu_('scanner');
  closeTalaanMenu_();
  // Reuse the existing scanner implementation/UI.
  const content=document.getElementById('dashboardContent');
  content.innerHTML='<div class="talaan-page"><div class="attendance-card"><h2 class="section-heading">📷 QR Scanner</h2><p class="section-description">Scan the student TALAAN QR code to record attendance.</p><div id="reader"></div><div id="scanLoading" class="status">Starting camera...</div><div id="scanResult" class="result"></div></div></div>';
  clearTimeout(scannerRestartTimer);stopScanner(false);
  scannerRestartTimer=setTimeout(function(){if(currentRole==='Secretary')startScanner();},300);
}

async function onScanSuccess(decodedText) {
  if (processing || !scanner || !scanning) return;
  processing=true;
  const loading=document.getElementById('scanLoading');
  const result=document.getElementById('scanResult');
  if(loading)loading.textContent='⏳ QR detected. Processing attendance...';
  try{if(scanner)scanner.pause(true);}catch(e){}
  try{const data=await apiRequest('record',{qrText:decodedText});displayResult(data);}catch(error){showScanError(error.message);}
  setTimeout(async function(){processing=false;if(scanner&&scanning){try{scanner.resume();if(loading)loading.textContent='📷 CAMERA ACTIVE — Ready for next QR code.';}catch(e){await restartScannerAutomatically();}}},1200);
}

function renderHeaderLogo_() {
  const topbar=document.querySelector('.topbar');
  if(!topbar || document.getElementById('talaanHeaderLogo')) return;
  const title=topbar.querySelector('.top-title');
  if(title){title.style.display='none';}
  const left=document.createElement('div');left.className='talaan-top-left';
  left.innerHTML='<img id="talaanHeaderLogo" class="talaan-header-logo" src="' + TALAAN_LOGO_DATA + '" alt="TALAAN"><div><div style="font-size:19px;font-weight:900;color:#17266b">SSG TALAAN</div><div style="font-size:11px;color:#718096">Digital Attendance and Records Management System</div></div>';
  topbar.insertBefore(left,topbar.firstChild);
}

/* =====================================================
   REFRESH-PERSISTENCE INITIALIZER
   ===================================================== */

window.addEventListener('DOMContentLoaded', function(){
  injectTalaanBranding_();
  ensureHamburger_();
  renderHeaderLogo_();

  // Make the original Teacher/Student button use the protected portal.
  const roleButtons=document.querySelectorAll('.role-button');
  roleButtons.forEach(function(btn){
    if((btn.textContent||'').toLowerCase().includes('teacher/student')){
      btn.onclick=openPortalLogin_;
    }
  });

  const stored=getStoredTalaanSession_();
  if(!stored){
    localStorage.removeItem('talaanSession');
    return;
  }

  talaanSession=stored;
  currentRole=stored.session.role;
  secretaryCodeSession=stored.session.code||'';

  // Validate the stored session before restoring the application.
  apiRequest('profile').then(function(data){
    if(!data || data.success!==true) throw new Error('Invalid session');
    openDashboard(currentRole, stored.session);
  }).catch(function(){
    clearTalaanSession_();
    currentRole=null;
    document.getElementById('appScreen')?.classList.add('hidden');
    document.getElementById('welcomeScreen')?.classList.remove('hidden');
  });
});

</script>
